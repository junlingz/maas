<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaaS 个人视角 - API key</title>
<style>
:root{
  --primary:#165DFF;
  --bg:#F5F7FA;
  --card:#fff;
  --line:#E5E6EB;
  --line2:#F2F3F5;
  --text:#1D2129;
  --muted:#4E5969;
  --soft:#86909C;
  --green:#00B42A;
  --orange:#FF7D00;
  --red:#F53F3F;
  --purple:#722ED1;
}
*{box-sizing:border-box}
body{margin:0;min-width:1180px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.layout{display:flex;min-height:100vh}
.side{width:224px;background:#fff;border-right:1px solid var(--line2);padding:18px 0}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--line2);font-weight:750;color:var(--primary);font-size:17px}
.nav{padding:14px 0}
.nav div{height:42px;display:flex;align-items:center;padding:0 22px;color:var(--muted);font-size:14px;cursor:pointer}
.nav div.active{color:var(--primary);background:#F0F7FF;border-right:3px solid var(--primary);font-weight:650}
.main{flex:1;min-width:0}
.top{height:54px;background:#fff;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;color:var(--muted)}
.content{padding:24px 28px 30px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
h1{font-size:24px;margin:0 0 6px;font-weight:700}
.sub{color:var(--soft);font-size:13px}
.api-hero{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:22px 24px;margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.api-hero h1{font-size:26px;margin-bottom:8px}
.api-hero .sub{max-width:720px;line-height:1.7}
.api-actions{display:flex;gap:10px;align-items:center;white-space:nowrap}
.api-section{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:18px;margin-bottom:14px}
.api-table th,.api-table td{padding:14px 12px}
.muted-line{color:var(--soft);font-size:12px;margin-top:5px}
.code-box{border:1px solid var(--line);background:#FAFBFC;border-radius:6px;padding:13px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:#1D2129;line-height:1.8;word-break:break-all}
.api-guide{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.api-guide .card{margin:0}
.btn{height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 14px;font-size:13px;color:var(--text);cursor:pointer}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--red);border-color:#FFD8D8}
.btn + .btn{margin-left:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:16px}
.metric .label{font-size:13px;color:var(--muted);margin-bottom:8px}
.metric .value{font-size:28px;font-weight:700}
.metric .value small{font-size:13px;color:var(--soft);font-weight:400;margin-left:4px}
.metric .foot{font-size:12px;color:var(--soft);border-top:1px solid var(--line2);margin-top:10px;padding-top:9px}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title b{font-size:16px}
.notice{background:#F0F7FF;border:1px solid #BEDAFF;border-left:4px solid var(--primary);border-radius:6px;padding:12px 14px;color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F7F8FA;color:var(--muted);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tag{display:inline-flex;height:22px;align-items:center;border-radius:4px;padding:0 8px;font-size:12px;background:#E8F3FF;color:#0E42D2}
.tag.green{background:#E8FFEA;color:#15803D}
.tag.orange{background:#FFF7E8;color:#C2410C}
.tag.red{background:#FFECE8;color:#B91C1C}
.tag.gray{background:#F2F3F5;color:var(--muted)}
.status-cell{display:inline-flex;align-items:center;gap:8px}
.status-edit{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);cursor:pointer;background:#fff;font-size:13px}
.status-edit:hover{border-color:#8FB1FF;color:var(--primary);background:#F0F7FF}
.key{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:#1D2129}
.link{color:var(--primary);cursor:pointer;margin-right:10px}
.link.danger{color:var(--red)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:#fff;font:inherit;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.progress{height:8px;border-radius:999px;background:#F2F3F5;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line2);margin-bottom:16px}
.tabs span{height:38px;display:inline-flex;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
.tabs span.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:650}
.filter-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:14px}
.filter-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.filter-row select,.filter-row input{width:100%;height:36px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:#fff;font:inherit;color:var(--text)}
.date-range-wrap{position:relative}
.date-range-trigger{position:relative}
.date-range-trigger input{padding-right:36px;cursor:pointer}
.calendar-mark{position:absolute;right:10px;bottom:9px;color:var(--muted);font-size:14px;pointer-events:none}
.date-popover{position:absolute;top:64px;left:0;width:360px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(29,33,41,.14);padding:14px;z-index:12;display:none}
.date-popover.show{display:block}
.date-popover .range-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.date-popover .range-actions{display:flex;justify-content:flex-end;gap:8px}
.chart-card{height:270px;position:relative;overflow:hidden}
.usage-chart{height:360px;margin-bottom:14px}
.usage-tabs{margin-bottom:22px}
.usage-filter{grid-template-columns:1.1fr 1fr 1fr 1fr auto auto}
.usage-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.usage-metrics .metric{text-align:center;background:#FAFBFC;border-color:#F2F3F5}
.usage-metrics .value{font-size:20px;margin-bottom:12px}
.usage-metrics .label{font-size:14px}
.chart-tools{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.chart-tools span{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;background:#F7F8FA}
.chart-tools span.active{background:#fff;border:1px solid var(--line);color:var(--text)}
.chart-grid{position:absolute;inset:58px 20px 38px 52px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 40px,#EDF0F5 41px)}
.chart-line{position:absolute;left:52px;right:24px;bottom:54px;height:120px}
.chart-line svg{width:100%;height:100%;overflow:visible}
.axis-x{position:absolute;left:52px;right:24px;bottom:18px;display:flex;justify-content:space-between;color:var(--soft);font-size:12px}
.bar{height:8px;border-radius:999px;background:#EEF1F6;overflow:hidden;min-width:180px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5B6DFF,#8F63FF)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.log-text{max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.task-head{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:14px;margin-bottom:14px}
.task-cell{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:14px 16px}
.task-cell .label{font-size:12px;color:var(--soft);margin-bottom:8px}
.task-cell .main{font-size:18px;font-weight:700;color:var(--text)}
.stage-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stage{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff;color:var(--muted)}
.stage.done{border-color:#B7E4C7;background:#F1FFF5;color:#15803D}
.stage.active{border-color:#8FB1FF;background:#F0F7FF;color:var(--primary)}
.log-console{background:#111827;color:#D1D5DB;border-radius:6px;padding:14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:2;max-height:280px;overflow:auto}
.log-console .time{color:#9CA3AF;margin-right:10px}
.log-console .info{color:#93C5FD}
.log-console .ok{color:#86EFAC}
.log-console .warn{color:#FCD34D}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:4px;height:36px;padding:0 10px;font:inherit;background:#fff}
.field textarea{height:82px;padding:9px 10px;resize:none}
.wide{grid-column:1 / -1}
.modal-form{display:grid;grid-template-columns:1fr;gap:16px}
.permission-row{display:flex;gap:12px}
.permission-option{min-width:96px;height:36px;border:1px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;cursor:pointer}
.permission-option input{accent-color:var(--primary)}
.permission-option:has(input:checked){border-color:#8FB1FF;background:#F0F7FF;color:var(--primary);font-weight:650}
.check-row{display:flex;gap:14px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);border-radius:18px;padding:0 14px;background:#fff;color:var(--text)}
.check input{accent-color:var(--primary)}
.check:has(input:checked){border-color:#8FB1FF;background:#F0F7FF;color:var(--primary)}
.modal-mask{position:fixed;inset:0;background:rgba(29,33,41,.45);display:none;align-items:center;justify-content:center;z-index:20}
.modal-mask.show{display:flex}
.modal{width:820px;max-width:92vw;background:#fff;border-radius:8px;box-shadow:0 18px 48px rgba(0,0,0,.18);overflow:hidden}
.modal-head{height:54px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.modal-head b{font-size:17px}
.close{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft)}
.close:hover{background:#F2F3F5;color:var(--text)}
.modal-body{padding:18px}
.modal-foot{height:58px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;align-items:center;padding:0 18px;background:#FAFBFC}
.secret-box{border:1px dashed #8FB1FF;background:#F0F7FF;border-radius:6px;padding:14px;font-family:"SF Mono",Menlo,Consolas,monospace;word-break:break-all;color:#0E42D2}
.toast{position:fixed;right:24px;top:70px;background:#1D2129;color:#fff;border-radius:6px;padding:11px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;z-index:30}
.toast.show{display:block}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">MaaS 个人中心</div>
    <div class="nav">
      <div class="active" data-page="keys">API key</div>
      <div data-page="usage">用量统计</div>
      <div data-page="logs">任务日志</div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div id="breadcrumb">首页 / 个人中心 / API key</div>
      <div>当前账号：li.user · 普通用户</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head"><b id="modalTitle">弹窗</b><span class="close" id="modalClose">×</span></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalOk">确定</button></div>
  </div>
</div>
<div class="toast" id="toast">操作成功</div>

<script>
const content = document.getElementById('content');
const breadcrumb = document.getElementById('breadcrumb');
const mask = document.getElementById('modalMask');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const toast = document.getElementById('toast');

const currentUser = {
  roles: ['普通用户', 'VIP用户', '普通机构用户'],
  teams: ['算法一组', '政务项目组']
};
const personalRoles = ['普通用户'];
const vipRoles = ['VIP用户'];
const organizationRoles = ['普通机构用户', 'VIP机构用户', '政府用户', '独立机构用户1', '独立机构用户2'];
const logTasks = [
  {id:'REQ-20260721-0001', taskId:'TASK-0721-001', name:'客服问答模型评估', type:'评测', runtime:'18 分钟', time:'2026-07-21 14:19:05', apiKey:'默认调用 Key', owner:'个人模式', status:'执行中'},
  {id:'REQ-20260720-0048', taskId:'TASK-0720-014', name:'政务材料问答调用', type:'推理', runtime:'1 小时 12 分钟', time:'2026-07-20 19:15:44', apiKey:'文档助手 Key', owner:'团队模式', status:'已完成'},
  {id:'REQ-20260719-0026', taskId:'TASK-0719-008', name:'知识库检索效果评估', type:'业务', runtime:'26 分钟', time:'2026-07-19 10:56:40', apiKey:'文档助手 Key', owner:'团队模式', status:'已完成'},
  {id:'REQ-20260718-0011', taskId:'TASK-0718-006', name:'客服语料微调训练', type:'训练', runtime:'42 分钟', time:'2026-07-18 10:02:39', apiKey:'默认调用 Key', owner:'VIP模式', status:'已完成'}
];

function getApiKeyModeOptions(){
  const hasPersonalRole = currentUser.roles.some(role => personalRoles.includes(role));
  const hasVipRole = currentUser.roles.some(role => vipRoles.includes(role));
  const hasOrganizationRole = currentUser.roles.some(role => organizationRoles.includes(role));
  const options = [];
  if(hasPersonalRole) options.push('个人模式');
  if(hasOrganizationRole) options.push('团队模式');
  if(hasVipRole) options.push('VIP模式');
  return options.length ? options : ['个人模式'];
}

function renderModeOptions(){
  return getApiKeyModeOptions().map(option => `<option>${option}</option>`).join('');
}

function getApiKeyModeConfig(){
  const hasPersonalRole = currentUser.roles.some(role => personalRoles.includes(role));
  const hasVipRole = currentUser.roles.some(role => vipRoles.includes(role));
  const hasTeamRole = currentUser.roles.some(role => organizationRoles.includes(role));
  return {
    showPersonal: hasPersonalRole,
    showTeam: hasTeamRole,
    showVip: hasVipRole,
    defaultMode: hasPersonalRole ? 'personal' : (hasTeamRole ? 'team' : 'vip')
  };
}

function renderModeButtons(){
  const config = getApiKeyModeConfig();
  const items = [];
  if(config.showPersonal){
    items.push(`<label class="permission-option"><input type="radio" name="apiMode" value="personal" ${config.defaultMode === 'personal' ? 'checked' : ''}>个人模式</label>`);
  }
  if(config.showTeam){
    items.push(`<label class="permission-option"><input type="radio" name="apiMode" value="team" ${config.defaultMode === 'team' ? 'checked' : ''}>团队模式</label>`);
  }
  if(config.showVip){
    items.push(`<label class="permission-option"><input type="radio" name="apiMode" value="vip" ${config.defaultMode === 'vip' ? 'checked' : ''}>VIP模式</label>`);
  }
  return items.join('');
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}
function openModal(title, body, okText='确定'){
  modalTitle.textContent = title;
  modalBody.innerHTML = body;
  document.getElementById('modalOk').textContent = okText;
  mask.classList.add('show');
}
function closeModal(){
  mask.classList.remove('show');
  document.getElementById('modalOk').textContent = '确定';
}

const pages = {
  overview: {
    crumb:'首页 / 个人中心 / 个人概览',
    html:`<div class="title-row"><div><h1>个人概览</h1><div class="sub">个人视角只展示自己可用的模型、额度、密钥和任务状态。</div></div><button class="btn primary" data-page-link="keys">管理 API Key</button></div>
    <div class="grid-4">
      <div class="card metric"><div class="label">API Key</div><div class="value">2<small>个</small></div><div class="foot">启用 1 · 禁用 1</div></div>
      <div class="card metric"><div class="label">本月调用</div><div class="value">32<small>万 Token</small></div><div class="foot">额度剩余 18 万</div></div>
      <div class="card metric"><div class="label">训练任务</div><div class="value">2<small>个</small></div><div class="foot">运行中 1 · 排队中 1</div></div>
      <div class="card metric"><div class="label">安全提醒</div><div class="value">1<small>项</small></div><div class="foot">有 Key 90 天未轮换</div></div>
    </div>
    <div class="card"><div class="panel-title"><b>最近调用</b><button class="btn" data-action="refresh">刷新</button></div>
      <table><thead><tr><th>时间</th><th>模型</th><th>调用来源</th><th>消耗</th><th>状态</th></tr></thead>
      <tbody><tr><td>2026-07-18 15:42</td><td>GLM-4-Flash</td><td>默认调用 Key</td><td>2,340 Token</td><td><span class="tag green">成功</span></td></tr>
      <tr><td>2026-07-18 14:18</td><td>GLM-4-Plus</td><td>文档助手 Key</td><td>8,920 Token</td><td><span class="tag green">成功</span></td></tr></tbody></table>
    </div>`
  },
  keys: {
    crumb:'首页 / 个人中心 / API key',
    html:`<div class="api-hero">
      <div>
        <h1>API Keys</h1>
      </div>
      <div class="api-actions"><button class="btn primary" data-modal="createKey">创建 API key</button></div>
    </div>
    <div class="api-section">
      <div class="panel-title"><b>API Keys</b><button class="btn" data-action="refresh">刷新</button></div>
      <div class="toolbar">
        <input placeholder="搜索名称" aria-label="搜索名称">
        <select aria-label="状态筛选"><option>全部状态</option><option>启用</option><option>禁用</option></select>
        <button class="btn" data-action="refresh">查询</button>
        <button class="btn" data-action="reset">重置</button>
      </div>
      <table class="api-table"><thead><tr><th>名称</th><th>Key</th><th>创建时间</th><th>最后使用</th><th>额度归属</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td><b>默认调用 Key</b></td><td><span class="key">sk-************************9f2a</span></td><td>2026-06-20 10:24</td><td>2026-07-18 15:42</td><td>个人模式</td><td><span class="status-cell"><span class="tag green">启用</span><span class="status-edit" data-modal="statusKey">✎</span></span></td><td><span class="link" data-action="copy">复制</span><span class="link" data-modal="keyDetail">查看</span><span class="link" data-modal="editKey">重命名</span><span class="link danger" data-modal="deleteKey">删除</span></td></tr>
        <tr><td><b>文档助手 Key</b></td><td><span class="key">sk-************************7a8c</span></td><td>2026-04-02 09:11</td><td>2026-07-10 09:11</td><td>团队模式</td><td><span class="status-cell"><span class="tag gray">禁用</span><span class="status-edit" data-modal="statusKey">✎</span></span></td><td><span class="link" data-action="copy">复制</span><span class="link" data-modal="keyDetail">查看</span><span class="link" data-modal="editKey">重命名</span><span class="link danger" data-modal="deleteKey">删除</span></td></tr>
      </tbody></table>
    </div>`
  },
  usage: {
    crumb:'首页 / 个人中心 / 用量统计',
    html:`<div class="title-row"><div><h1>用量统计</h1></div><button class="btn" data-action="export">导出</button></div>
    <div class="api-section">
      <div class="tabs usage-tabs"><span class="active">总览</span><span>Token</span><span>GPU 实例</span><span>资源事件</span></div>
      <div class="filter-row usage-filter">
        <div><label>时间范围</label><select><option>2026-06-22 → 2026-07-21</option><option>近 7 天</option><option>近 30 天</option></select></div>
        <div><label>模型</label><select><option>全部模型</option><option>qwen-plus</option><option>deepseek-v3</option><option>embedding-v1</option></select></div>

function render(page='keys'){
  const data = pages[page] || pages.keys;
  content.innerHTML = data.html;
  breadcrumb.textContent = data.crumb;
  document.querySelectorAll('.nav div').forEach(item => item.classList.toggle('active', item.dataset.page === page));
  if(page === 'logs') renderLogTasks();
}

function renderLogTasks(){
  const target = document.getElementById('logTaskRows');
  if(!target) return;
  const name = (document.getElementById('logNameFilter')?.value || '').trim();
  const status = document.getElementById('logStatusFilter')?.value || '全部状态';
  const type = document.getElementById('logTypeFilter')?.value || '全部类型';
  const logDate = document.getElementById('logDateFilter')?.value || '';
  const dateRange = logDate.split('-').map(item => item.trim().replaceAll('/', '-'));
  const startDate = dateRange[0] || '';
  const endDate = dateRange[1] || startDate;
  const rows = logTasks.filter(task => {
    const matchName = !name || task.name.includes(name) || task.taskId.includes(name) || task.id.includes(name);
    const matchStatus = status === '全部状态' || task.status === status;
    const matchType = type === '全部类型' || task.type === type;
    const taskDate = task.time.slice(0, 10);
    const matchDate = !startDate || (taskDate >= startDate && taskDate <= endDate);
    return matchName && matchStatus && matchType && matchDate;
  });
  target.innerHTML = rows.length ? rows.map(task => {
    const statusClass = task.status === '执行中' || task.status === '已完成' ? 'green' : 'red';
    const actions = task.status === '执行中'
      ? `<span class="link" data-modal="taskRunning">查看结果</span>`
      : `<span class="link" data-modal="logDetail">查看结果</span>`;
    return `<tr><td>${task.time}</td><td><span class="key">${task.id}</span></td><td><span class="key">${task.taskId}</span></td><td>${task.name}</td><td>${task.type}</td><td>${task.runtime}</td><td><span class="tag ${statusClass}">${task.status}</span></td><td>${actions}</td></tr>`;
  }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--soft);padding:28px">暂无匹配日志</td></tr>`;
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-page]');
  if(nav){ render(nav.dataset.page); return; }
  const link = e.target.closest('[data-page-link]');
  if(link){ render(link.dataset.pageLink); return; }
  const usageTab = e.target.closest('[data-usage-tab]');
  if(usageTab){
    document.querySelectorAll('[data-usage-tab]').forEach(tab => tab.classList.toggle('active', tab === usageTab));
    renderUsageTab(usageTab.dataset.usageTab);
    return;
  }
  const modal = e.target.closest('[data-modal]');
  if(modal){
    const m = modalTemplate(modal.dataset.modal);
    openModal(m.title, m.body, m.ok || '确定');
    return;
  }
  const action = e.target.closest('[data-action]');
  if(action){
    if(action.dataset.action === 'openDateRange'){
      const pop = document.getElementById('logDatePopover');
      if(pop) pop.classList.add('show');
      return;
    }
    if(action.dataset.action === 'cancelDateRange'){
      const pop = document.getElementById('logDatePopover');
      if(pop) pop.classList.remove('show');
      return;
    }
    if(action.dataset.action === 'applyDateRange'){
      const start = document.getElementById('logStartDatePicker')?.value || '2026-07-15';
      const end = document.getElementById('logEndDatePicker')?.value || start;
      const input = document.getElementById('logDateFilter');
      const pop = document.getElementById('logDatePopover');
      if(input) input.value = `${start.replaceAll('-', '/')} - ${end.replaceAll('-', '/')}`;
      if(pop) pop.classList.remove('show');
      renderLogTasks();
      showToast('已按日期区间筛选');
      return;
    }
    if(action.dataset.action === 'searchLogs'){
      renderLogTasks();
      showToast('已按条件筛选');
      return;
    }
    if(action.dataset.action === 'resetLogs'){
      const name = document.getElementById('logNameFilter');
      const status = document.getElementById('logStatusFilter');
      const type = document.getElementById('logTypeFilter');
      const date = document.getElementById('logDateFilter');
      const start = document.getElementById('logStartDatePicker');
      const end = document.getElementById('logEndDatePicker');
      if(name) name.value = '';
      if(status) status.value = '全部状态';
      if(type) type.value = '全部类型';
      if(date) date.value = '2026/07/15 - 2026/07/21';
      if(start) start.value = '2026-07-15';
      if(end) end.value = '2026-07-21';
      renderLogTasks();
      showToast('筛选条件已重置');
      return;
    }
    if(action.dataset.action === 'refreshLogs'){
      renderLogTasks();
      showToast('任务状态已刷新');
      return;
    }
    const map = {copy:'API Key 已复制（演示）', refresh:'已刷新', reset:'筛选条件已重置', export:'已导出调用明细（演示）', createTask:'进入新建任务流程（演示）'};
    showToast(map[action.dataset.action] || '操作成功');
  }
});
document.addEventListener('change', e => {
  if(e.target.matches('#logTypeFilter, #logStatusFilter, #logDateFilter')) renderLogTasks();
});
document.addEventListener('click', e => {
  const pop = document.getElementById('logDatePopover');
  if(pop && !e.target.closest('.date-range-wrap')) pop.classList.remove('show');
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalOk').addEventListener('click', () => {
  const isCreate = modalTitle.textContent === '创建API Key';
  closeModal();
  if(isCreate){
    const m = modalTemplate('keyCreated');
    openModal(m.title, m.body, m.ok);
  } else {
    showToast('操作已确认（演示）');
  }
});
mask.addEventListener('click', e => { if(e.target === mask) closeModal(); });
render('logs');
